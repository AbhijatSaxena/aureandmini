# Firebase App Hosting config. Secrets are created with:
#   firebase apphosting:secrets:set ADMIN_PASSWORD   (and SESSION_SECRET)
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
env:
  - variable: ADMIN_PASSWORD
    secret: ADMIN_PASSWORD
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
  # - variable: NEXT_PUBLIC_WHATSAPP
  #   value: "919999999999"
