name: CI

# Deployment (CD) is done by Firebase App Hosting itself: it rolls out every push to `main`
# automatically (backend `aureandmini`, Settings -> Deployment -> automatic rollouts ON).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          ADMIN_USERNAME: ci
          ADMIN_PASSWORD: ci-build-only
